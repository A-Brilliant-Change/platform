<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Tulsa Origin Map</title>
  <desc id="desc">An origin map with a subtle route line reflecting Tulsa and connected opportunity regions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0a1d38"/>
      <stop offset="100%" stop-color="#091b36"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <g stroke="#d4af37" stroke-width="2" opacity="0.75" fill="none">
    <path d="M150 560 C 350 480, 420 500, 550 430 S 850 300, 1200 450"/>
    <path d="M450 760 L620 540 L860 610 L980 420"/>
  </g>
  <g fill="#d4af37" opacity="0.8">
    <circle cx="550" cy="430" r="8"/>
    <circle cx="620" cy="540" r="8"/>
    <circle cx="980" cy="420" r="8"/>
    <circle cx="1200" cy="450" r="8"/>
  </g>
  <g opacity="0.45" stroke="#ffffff" stroke-width="1">
    <path d="M120 770 L1280 770"/>
    <path d="M150 190 L1050 190"/>
    <path d="M170 260 L350 260"/>
    <path d="M990 260 L1280 260"/>
  </g>
</svg>
